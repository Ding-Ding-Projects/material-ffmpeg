name: Build, release, and deploy Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}-${{ github.run_number }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ""
      WIN_CSC_LINK: ""
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Restore exact dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Assign unique build version
        shell: pwsh
        run: npm version --no-git-tag-version "0.1.$env:GITHUB_RUN_NUMBER"

      - name: Build unsigned Squirrel.Windows release
        shell: pwsh
        run: npm run dist

      - name: Collect and validate release assets
        shell: pwsh
        run: ./scripts/collect-release.ps1 -Silent

      - name: Count repository lines at the release commit
        shell: pwsh
        run: ./scripts/count-lines.ps1 | Set-Content -LiteralPath dist/line-count.md -Encoding utf8

      - name: Write measured release notes
        shell: pwsh
        run: |
          $tag = "v0.1.$env:GITHUB_RUN_NUMBER-r$env:GITHUB_RUN_ATTEMPT"
          ./scripts/write-release-notes.ps1 -LineCountPath dist/line-count.md -OutputPath dist/RELEASE_NOTES.md -Tag $tag

      - name: Publish unique non-draft release
        shell: pwsh
        run: |
          $tag = "v0.1.$env:GITHUB_RUN_NUMBER-r$env:GITHUB_RUN_ATTEMPT"
          $assets = Get-ChildItem -LiteralPath dist/release-assets -File | ForEach-Object { $_.FullName }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "material-ffmpeg $tag" --notes-file dist/RELEASE_NOTES.md --latest

      - name: Verify published release and downloadable assets
        shell: pwsh
        run: |
          $tag = "v0.1.$env:GITHUB_RUN_NUMBER-r$env:GITHUB_RUN_ATTEMPT"
          $release = gh release view $tag --json tagName,isDraft,targetCommitish,url,assets | ConvertFrom-Json
          if ($release.isDraft -or $release.tagName -ne $tag -or $release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Published release identity does not match the build candidate.' }
          if ($release.assets.Count -lt 4 -or @($release.assets | Where-Object { $_.size -le 0 -or -not $_.url }).Count -gt 0) { throw 'Published release assets are missing, empty, or not downloadable.' }
          Write-Host "Published release: $($release.url)"

      - name: Preserve safe build evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/squirrel-windows/**
            dist/release-assets/**
            dist/RELEASE_NOTES.md
            dist/line-count.md
          if-no-files-found: warn
          retention-days: 14

  pages:
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Pages source
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
